{% extends "base.html" %}
{% block title %}Log in · Veritas Provenance{% endblock %}
{% block content %}
<form class="auth" method="post" action="{{ url_for('login') }}">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Log in</button>
  <p class="muted">No account? <a href="{{ url_for('signup') }}">Sign up</a></p>
</form>
{% endblock %}
